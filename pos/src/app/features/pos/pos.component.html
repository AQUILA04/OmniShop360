<div class="pos-header">
  <div class="brand-section">
    <div class="logo-icon">🛍️</div>
    <div class="store-info">
      <span class="store-name">Main Store</span>
      <span class="register-info">Register 01 • Online</span>
    </div>
  </div>

  <div class="header-right">
    <!-- Date & Time -->
    <div class="datetime-section">
      <span class="time">{{ currentDate | date:'shortTime' }}</span>
      <span class="date">{{ currentDate | date:'mediumDate' }}</span>
    </div>

    <div class="user-profile-wrapper" (click)="toggleProfileMenu()">
      <div class="user-avatar-circle">
        <span>{{ cashierInitials }}</span>
      </div>
      <div class="cashier-info">
        <span class="cashier-name">{{ cashierName }}</span>
        <span class="cashier-role">{{ cashierRole }}</span>
      </div>
      <div class="chevron">⌄</div>

      <!-- Dropdown Menu -->
      <div class="profile-dropdown" *ngIf="isProfileMenuOpen">
        <div class="dropdown-item">
          <app-icon-user></app-icon-user>
          Profil
        </div>
        <div class="dropdown-item">
          <app-icon-key></app-icon-key>
          Changer mot de passe
        </div>
        <div class="dropdown-item" routerLink="/back-office">
          <app-icon-back-office></app-icon-back-office>
          Back Office
        </div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item text-danger" (click)="logout()">
          <app-icon-logout></app-icon-logout>
          Déconnexion
        </div>
      </div>
    </div>
  </div>
</div>
<div class="pos-layout">
  <!-- Left Side: Product Grid -->
  <div class="left-panel">
    <app-product-grid [products]="products" [categories]="categories" (addToCart)="addToCart($event)"
      (search)="onSearch($event)"></app-product-grid>
  </div>

  <!-- Right Side: Cart Panel -->
  <div class="right-panel">
    <app-cart-panel [cartItems]="cartItems" [total]="totalAmount" (updateQuantity)="updateQuantity($event)"
      (removeItem)="removeFromCart($event)" (clearCart)="clearCart()" (checkout)="openPaymentModal()"></app-cart-panel>
  </div>

  <!-- Overlays -->
  <app-payment-modal [isOpen]="isPaymentModalOpen" [total]="totalAmount" [subtotal]="subtotal" [tax]="tax"
    [cartItems]="cartItems" (closeEvent)="closePaymentModal()"
    (checkoutEvent)="processCheckout($event)"></app-payment-modal>

  <app-success-modal [isOpen]="isSuccessModalOpen" [ticketNumber]="lastSaleTicket" [totalAmount]="totalAmount"
    [paymentMethod]="lastPaymentMethod" [transactionDate]="lastTransactionDate" (print)="printReceipt()"
    (newSale)="startNewSale()">
  </app-success-modal>

  <app-receipt-preview-modal [isOpen]="isReceiptPreviewOpen" [ticketNumber]="lastSaleTicket" [totalAmount]="totalAmount"
    [paymentMethod]="lastPaymentMethod" [transactionDate]="lastTransactionDate" [cartItems]="cartItems"
    (close)="closeReceiptPreview()" (newSale)="startNewSale()">
  </app-receipt-preview-modal>
</div>
