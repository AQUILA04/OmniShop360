name: CI/CD - Build & Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.OWNER }}/omnishop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short sha
        id: meta
        run: echo "::set-output name=sha::${GITHUB_SHA}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Build & push pos
        uses: docker/build-push-action@v4
        with:
          context: ./pos
          file: ./pos/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-pos:latest
            ${{ env.IMAGE_PREFIX }}-pos:${{ github.sha }}

      - name: Build & push keycloak
        uses: docker/build-push-action@v4
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-keycloak:latest
            ${{ env.IMAGE_PREFIX }}-keycloak:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent and add private key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Copy docker-compose to server (optional)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy/dev/docker-compose.yml"
          target: "/srv/omnishop360/compose/docker-compose.yml"

      - name: Remote deploy: pull images & up
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /srv/omnishop360/compose
            cd /srv/omnishop360/compose
            # optional: ensure .env exists
            if [ ! -f .env ]; then
              echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD:-omnishop_password }}" > .env
              echo "KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}" >> .env
            fi
            docker compose pull || true
            docker compose up -d
            docker image prune -f || true

      - name: Post-deploy healthcheck
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://$SERVER_IP:8081/api/actuator/health >/dev/null 2>&1; then
              echo "Health OK"; exit 0
            fi
            echo "Waiting for health... ($i)"; sleep 10
          done
          echo "Health check failed"; exit 1

