name: CI/CD - Build & Deploy to Hetzner VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: AQUILA04
  IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/omnishop

jobs:
  infra:
    runs-on: ubuntu-latest
    outputs:
      KEYCLOAK_CLIENT_SECRET: ${{ steps.tfapply.outputs.KEYCLOAK_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Verify Terraform installation
        run: |
          echo "Verifying terraform is available"
          terraform version
          which terraform

      - name: Ensure HETZNER_TOKEN secret exists
        run: |
          if [ -z "${{ secrets.HETZNER_TOKEN }}" ]; then
            echo "ERROR: HETZNER_TOKEN secret is not set. Aborting."; exit 1
          fi

      - name: Terraform Init & Apply (keycloak-config/)
        id: tfapply
        env:
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
        run: |
          set -e
          # use keycloak-config directory which contains Keycloak Terraform resources
          cd keycloak-config || true
          terraform init -input=false
          terraform apply -auto-approve -input=false
          # Capture backend client secret output from terraform (repo uses backend_client_secret)
          secret=$(terraform output -raw backend_client_secret 2>/dev/null || true)
          echo "KEYCLOAK_CLIENT_SECRET=$secret" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short sha
        id: meta
        run: echo "::set-output name=sha::${GITHUB_SHA}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Build & push pos
        uses: docker/build-push-action@v4
        with:
          context: ./pos
          file: ./pos/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-pos:latest
            ${{ env.IMAGE_PREFIX }}-pos:${{ github.sha }}

      - name: Build & push keycloak
        uses: docker/build-push-action@v4
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-keycloak:latest
            ${{ env.IMAGE_PREFIX }}-keycloak:${{ github.sha }}

      - name: Write images metadata (artifact)
        run: |
          mkdir -p /tmp/images
          cat > /tmp/images/images.json <<EOF
{
  "backend": "${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/omnishop-backend:${{ github.sha }}",
  "frontend": "${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/omnishop-frontend:${{ github.sha }}",
  "pos": "${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/omnishop-pos:${{ github.sha }}",
  "keycloak": "${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/omnishop-keycloak:${{ github.sha }}"
}
EOF

      - name: Upload images metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: images-metadata
          path: /tmp/images/images.json

  deploy:
    needs: [build-and-push, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent and add private key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Prepare prod docker-compose (replace owner & tag)
        run: |
          mkdir -p /tmp/compose
          sed "s|__GHCR_OWNER__|${{ github.repository_owner }}|g; s|__TAG__|${{ github.sha }}|g" deploy/docker-compose.prod.yml > /tmp/compose/docker-compose.to_deploy.yml

      - name: Copy prod docker-compose to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          source: "/tmp/compose/docker-compose.to_deploy.yml"
          target: "/srv/omnishop360/compose/docker-compose.yml"

      - name: Copy Caddyfile to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy/Caddyfile"
          target: "/srv/omnishop360/compose"
          strip_components: 1

      - name: Prepare temp .env (contains secrets)
        run: |
          mkdir -p .github/temp_env
          cat > .github/temp_env/.env <<EOF
POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
KEYCLOAK_CLIENT_SECRET=${{ needs.infra.outputs.KEYCLOAK_CLIENT_SECRET }}
EOF

      - name: Copy .env to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          source: ".github/temp_env/.env"
          target: "/srv/omnishop360/compose/.env"

      - name: Remote deploy: pull images & up
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /srv/omnishop360/compose
            cd /srv/omnishop360/compose
            # .env is copied by the workflow; leave it as-is
            true
            docker compose pull || true
            docker compose up -d
            docker image prune -f || true

      - name: Post-deploy healthcheck
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://$SERVER_IP:8081/api/actuator/health >/dev/null 2>&1; then
              echo "Health OK"; exit 0
            fi
            echo "Waiting for health... ($i)"; sleep 10
          done
          echo "Health check failed"; exit 1



