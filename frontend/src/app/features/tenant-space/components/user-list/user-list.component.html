<app-generic-list [pageTitle]="pageTitle" [isLoading]="isLoading" [columnsConfig]="columnsConfig"
    [resultsLength]="resultsLength" [data]="data" [defaultSort]="{active: 'firstName', direction: 'asc'}"
    (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)" (searchChange)="onSearchChange($event)"
    (action)="onAction($event)">
</app-generic-list>
