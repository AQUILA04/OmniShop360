name: CI/CD - Deploy to Hetzner VPS

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (commit SHA or "latest")'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: aquila04
  REPO_NAME: omnishop360

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the image tag to deploy
  # ---------------------------------------------------------------------------
  resolve-images:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.resolve.outputs.backend_image }}
      frontend_image: ${{ steps.resolve.outputs.frontend_image }}
      pos_image: ${{ steps.resolve.outputs.pos_image }}
      keycloak_image: ${{ steps.resolve.outputs.keycloak_image }}
      deploy_tag: ${{ steps.resolve.outputs.deploy_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Resolve images to deploy
        id: resolve
        env:
          GHCR_TOKEN: ${{ secrets.OMNISHOP_GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          REGISTRY="${{ env.REGISTRY }}"
          OWNER="${{ env.GHCR_OWNER }}"
          REPO="${{ env.REPO_NAME }}"

          # Login to GHCR to check image existence
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

          # Determine which tag to use
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "deploy_tag=$TAG" >> "$GITHUB_OUTPUT"

          # Function to check if an image exists
          check_image() {
            local component="$1"
            local image="$REGISTRY/$OWNER/$REPO/$component:$TAG"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "$image"
              return 0
            else
              # Fallback to latest if specific tag not found
              local fallback_image="$REGISTRY/$OWNER/$REPO/$component:latest"
              echo "WARNING: $image not found, using $fallback_image" >&2
              echo "$fallback_image"
              return 0
            fi
          }

          BACKEND_IMAGE=$(check_image "backend")
          FRONTEND_IMAGE=$(check_image "frontend")
          POS_IMAGE=$(check_image "pos")
          KEYCLOAK_IMAGE=$(check_image "keycloak")

          echo "Backend image:   $BACKEND_IMAGE"
          echo "Frontend image:  $FRONTEND_IMAGE"
          echo "POS image:       $POS_IMAGE"
          echo "Keycloak image:  $KEYCLOAK_IMAGE"

          echo "backend_image=$BACKEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FRONTEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "pos_image=$POS_IMAGE" >> "$GITHUB_OUTPUT"
          echo "keycloak_image=$KEYCLOAK_IMAGE" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Deploy to Hetzner VPS
  # ---------------------------------------------------------------------------
  deploy:
    needs: [resolve-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent and add private key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Prepare docker-compose.yml with resolved images
        run: |
          mkdir -p deploy/compose
          cat > deploy/compose/docker-compose.yml << 'EOF'
          version: '3.8'

          services:
            postgres:
              image: postgres:16-alpine
              container_name: omnishop360-postgres
              environment:
                POSTGRES_DB: omnishop360
                POSTGRES_USER: omnishop360
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - omnishop360-network
              restart: unless-stopped

            redis:
              image: redis:7-alpine
              container_name: omnishop360-redis
              command: redis-server --appendonly yes
              volumes:
                - redis_data:/data
              networks:
                - omnishop360-network
              restart: unless-stopped

            keycloak:
              image: ${KEYCLOAK_IMAGE}
              container_name: omnishop360-keycloak
              environment:
                KC_BOOTSTRAP_ADMIN_USERNAME: admin
                KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
                KC_DB: postgres
                KC_DB_URL: jdbc:postgresql://postgres:5432/omnishop360
                KC_DB_USERNAME: omnishop360
                KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
                KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
                KC_HTTP_ENABLED: "true"
                KC_PROXY: edge
              volumes:
                - keycloak_data:/opt/keycloak/data
              networks:
                - omnishop360-network
              depends_on:
                - postgres
              restart: unless-stopped

            backend:
              image: ${BACKEND_IMAGE}
              container_name: omnishop360-backend
              environment:
                SPRING_PROFILES_ACTIVE: prod
                DB_HOST: postgres
                DB_PORT: 5432
                DB_NAME: omnishop360
                DB_USERNAME: omnishop360
                DB_PASSWORD: ${POSTGRES_PASSWORD}
                REDIS_HOST: redis
                REDIS_PORT: 6379
                KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
                KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
              networks:
                - omnishop360-network
              depends_on:
                - postgres
                - redis
                - keycloak
              restart: unless-stopped

            frontend:
              image: ${FRONTEND_IMAGE}
              container_name: omnishop360-frontend
              networks:
                - omnishop360-network
              restart: unless-stopped

            pos:
              image: ${POS_IMAGE}
              container_name: omnishop360-pos
              networks:
                - omnishop360-network
              restart: unless-stopped

            caddy:
              image: caddy:2-alpine
              container_name: omnishop360-caddy
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./Caddyfile:/etc/caddy/Caddyfile
                - caddy_data:/data
                - caddy_config:/config
              networks:
                - omnishop360-network
              depends_on:
                - frontend
                - backend
                - pos
              restart: unless-stopped

          volumes:
            postgres_data:
            redis_data:
            keycloak_data:
            caddy_data:
            caddy_config:

          networks:
            omnishop360-network:
              driver: bridge
          EOF

          # Replace image placeholders with actual resolved images
          sed -i "s|\${BACKEND_IMAGE}|${{ needs.resolve-images.outputs.backend_image }}|g" deploy/compose/docker-compose.yml
          sed -i "s|\${FRONTEND_IMAGE}|${{ needs.resolve-images.outputs.frontend_image }}|g" deploy/compose/docker-compose.yml
          sed -i "s|\${POS_IMAGE}|${{ needs.resolve-images.outputs.pos_image }}|g" deploy/compose/docker-compose.yml
          sed -i "s|\${KEYCLOAK_IMAGE}|${{ needs.resolve-images.outputs.keycloak_image }}|g" deploy/compose/docker-compose.yml

      - name: Prepare .env file
        run: |
          mkdir -p deploy/compose
          cat > deploy/compose/.env << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_HOSTNAME=${{ secrets.KEYCLOAK_HOSTNAME }}
          KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          EOF

      - name: Copy Caddyfile to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy/Caddyfile"
          target: "/srv/omnishop360/compose"
          strip_components: 1

      - name: Copy docker-compose and .env to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy/compose/*"
          target: "/srv/omnishop360/compose"
          strip_components: 2

      - name: Deploy on remote server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            cd /srv/omnishop360/compose

            # Login to GHCR to pull images
            echo "${{ secrets.OMNISHOP_GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            # Pull latest images
            docker compose pull

            # Restart services with new images
            docker compose up -d

            # Clean up old images
            docker image prune -f

            echo "Deployment completed with tag: ${{ needs.resolve-images.outputs.deploy_tag }}"

      - name: Healthcheck
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://$SERVER_IP:8081/api/actuator/health > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for backend to be ready... ($i/15)"
            sleep 10
          done
          echo "Health check failed"
          exit 1
