name: CI/CD - Build & Deploy to Hetzner VPS

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: aquila04
  IMAGE_PREFIX: ghcr.io/aquila04/omnishop360/omnishop
  REPO_NAME: omnishop360

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Build & push pos
        uses: docker/build-push-action@v4
        with:
          context: ./pos
          file: ./pos/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-pos:latest
            ${{ env.IMAGE_PREFIX }}-pos:${{ github.sha }}

      - name: Build & push keycloak
        uses: docker/build-push-action@v4
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-keycloak:latest
            ${{ env.IMAGE_PREFIX }}-keycloak:${{ github.sha }}

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent and add private key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Prepare prod docker-compose (replace owner & tag)
        run: |
          mkdir -p /tmp/compose
          sed "s|__GHCR_OWNER__|${{ github.repository_owner }}|g; s|__TAG__|${{ github.sha }}|g" deploy/docker-compose.prod.yml > /tmp/compose/docker-compose.yml

      - name: Prepare temp .env (contains secrets)
        run: |
          mkdir -p /tmp/compose
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > /tmp/compose/.env
          echo "KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" >> /tmp/compose/.env

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          source: "/tmp/compose/docker-compose.yml,/tmp/compose/.env"
          target: "/srv/omnishop360/compose"
          strip_components: 2

      - name: Copy Caddyfile to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy/Caddyfile"
          target: "/srv/omnishop360/compose"
          strip_components: 1

      - name: Copy keycloak-config (Terraform) to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          source: "keycloak-config"
          target: "/srv/omnishop360"
          strip_components: 0

      - name: "Remote deploy: pull images, start stack & configure Keycloak"
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            cd /srv/omnishop360/compose

            # 1. Pull images & start stack
            docker compose pull || true
            docker compose up -d
            docker image prune -f || true

            # 2. Wait for Keycloak to be ready (max 3 minutes)
            echo "Waiting for Keycloak to be ready..."
            for i in $(seq 1 18); do
              if curl -fsS http://localhost:8080/realms/master > /dev/null 2>&1; then
                echo "Keycloak is ready."
                break
              fi
              echo "  ... attempt $i/18, retrying in 10s"
              sleep 10
            done

            # Verify Keycloak is actually up before running Terraform
            if ! curl -fsS http://localhost:8080/realms/master > /dev/null 2>&1; then
              echo "ERROR: Keycloak did not become ready in time. Aborting."
              exit 1
            fi

            # 3. Run Terraform against local Keycloak
            cd /srv/omnishop360/keycloak-config

            # Install Terraform if not present
            if ! command -v terraform &> /dev/null; then
              echo "Installing Terraform..."
              curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o /tmp/terraform.zip
              unzip -o /tmp/terraform.zip -d /usr/local/bin
              chmod +x /usr/local/bin/terraform
              rm /tmp/terraform.zip
            fi

            terraform init -input=false -upgrade

            terraform apply -auto-approve -input=false \
              -var="keycloak_url=http://localhost:8080" \
              -var="keycloak_admin_username=admin" \
              -var="keycloak_admin_password=$KEYCLOAK_ADMIN_PASSWORD" \
              -var="superadmin_email=$SUPERADMIN_EMAIL" \
              -var="superadmin_initial_password=$SUPERADMIN_PASSWORD"

            # 4. Extract client secret and append to .env
            CLIENT_SECRET=$(terraform output -raw backend_client_secret 2>/dev/null || true)
            if [ -n "$CLIENT_SECRET" ]; then
              echo "KEYCLOAK_CLIENT_SECRET=$CLIENT_SECRET" >> /srv/omnishop360/compose/.env
              echo "Keycloak client secret written to .env"
            fi

            # 5. Restart backend to pick up new KEYCLOAK_CLIENT_SECRET
            cd /srv/omnishop360/compose
            docker compose restart backend || true
        env:
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_INITIAL_PASSWORD }}

      - name: Post-deploy healthcheck
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://$SERVER_IP:8081/api/actuator/health > /dev/null 2>&1; then
              echo "Health OK"; exit 0
            fi
            echo "Waiting for health... ($i)"; sleep 10
          done
          echo "Health check failed"; exit 1
